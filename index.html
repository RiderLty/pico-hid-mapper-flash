<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <title>pico-hid-mapper固件烧录</title>
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-title">
                <h1>pico-hid-mapper⚡固件烧录</h1>
                <p class="subtitle">在线烧录工具 · 支持 Chrome / Edge 的 WebUSB</p>
            </div>
        </header>
        <img src="https://statistics.rd5isto.org/i/7d79d52d-3e11-49fb-947d-3016c2c205f9" style="display:none;">
        <section class="card">
            <h2>连接设备</h2>
            <div class="row">
                <button id="connectBtn" class="btn btn-primary">连接设备</button>
                <span id="statusLine" class="status-line">未连接</span>
            </div>

            <dl id="deviceInfoPanel" class="device-info hidden">
                <div><dt>目标芯片</dt><dd id="deviceTarget">-</dd></div>
                <div><dt>VID:PID</dt><dd id="deviceVidPid">-</dd></div>
                <div><dt>厂商</dt><dd id="deviceManufacturer">-</dd></div>
                <div><dt>产品</dt><dd id="deviceProduct">-</dd></div>
                <div><dt>序列号</dt><dd id="deviceSerial">-</dd></div>
                <div><dt>USB 版本</dt><dd id="deviceUsbVersion">-</dd></div>
                <div><dt>设备版本</dt><dd id="deviceDeviceVersion">-</dd></div>
                <div><dt>Flash 范围</dt><dd id="deviceFlashRange">-</dd></div>
                <div><dt>扇区大小</dt><dd id="deviceSector">-</dd></div>
                <div><dt>页大小</dt><dd id="devicePage">-</dd></div>
            </dl>
        </section>

        <section class="card">
            <div class="card-header">
                <h2>烧录操作</h2>
                <div class="version-switch" role="group" aria-label="选择固件版本">
                    <button id="versionStableBtn" class="version-option is-active" type="button" data-channel="stable" aria-pressed="true">稳定版</button>
                    <button id="versionLatestBtn" class="version-option" type="button" data-channel="latest" aria-pressed="false">最新版</button>
                </div>
            </div>
            <div class="row">
                <button id="flashBtn" class="btn btn-primary">烧录固件</button>
            </div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </section>

        <section class="card">
            <h2>日志</h2>
            <div id="activityContent" class="activity-log"></div>
        </section>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>

</html>
